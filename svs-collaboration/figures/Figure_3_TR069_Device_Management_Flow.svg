<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="1510pt" height="184pt" viewBox="0.00 0.00 1510.00 184.00" xmlns="http://www.w3.org/2000/svg"><g transform="translate(4 180)"><polygon fill="white" stroke="transparent" points="-4,4 -4,-180 1506,-180 1506,4 -4,4"/><text text-anchor="middle" x="751" y="-152.8" font-family="Arial" font-size="24">Figure 3. TR-069 Device Management Flow</text><text text-anchor="middle" x="751" y="-126.8" font-family="Arial" font-size="24">Secure Remote Management via SVS DMS / ACS</text><rect x="0" y="-80" width="155" height="44" rx="12" fill="#eff6ff" stroke="#2563eb"/><text x="77.5" y="-67" text-anchor="middle" font-family="Arial" font-size="11">IQ-9075 Gateway</text><text x="77.5" y="-55" text-anchor="middle" font-family="Arial" font-size="11">TR-069 / CWMP Client</text><text x="77.5" y="-43" text-anchor="middle" font-family="Arial" font-size="11">(RDK-B management agent)</text><rect x="240" y="-76" width="195" height="36" rx="12" fill="#f8fafc" stroke="#64748b"/><text x="337.5" y="-61" text-anchor="middle" font-family="Arial" font-size="11">HTTPS / TLS or mTLS</text><text x="337.5" y="-49" text-anchor="middle" font-family="Arial" font-size="11">Device-initiated management session</text><line x1="155" y1="-58" x2="240" y2="-58" stroke="#334155"/><text x="197" y="-62" text-anchor="middle" font-family="Arial" font-size="10">CWMP</text><rect x="730" y="-92" width="206" height="68" rx="12" fill="#f5f3ff" stroke="#8b5cf6"/><text x="833" y="-79" text-anchor="middle" font-family="Arial" font-size="11">SVS DMS / ACS</text><text x="833" y="-67" text-anchor="middle" font-family="Arial" font-size="11">Device onboarding</text><text x="833" y="-55" text-anchor="middle" font-family="Arial" font-size="11">Configuration / parameter management</text><text x="833" y="-43" text-anchor="middle" font-family="Arial" font-size="11">Diagnostics / telemetry</text><text x="833" y="-31" text-anchor="middle" font-family="Arial" font-size="11">Campaign control / fleet grouping</text><line x1="435" y1="-58" x2="730" y2="-58" stroke="#334155"/><text x="582" y="-62" text-anchor="middle" font-family="Arial" font-size="10">Authenticated management channel</text><rect x="954" y="-116" width="548" height="116" fill="#f8fafc" stroke="#64748b"/><text x="962" y="-103" font-family="Arial" font-size="11">KEY POINTS</text><text x="962" y="-91" font-family="Arial" font-size="11">1. IQ-9075 acts as a TR-069/CWMP client; SVS DMS/ACS is the management server.</text><text x="962" y="-79" font-family="Arial" font-size="11">2. The device initiates the management session, avoiding arbitrary inbound internet access to the gateway.</text><text x="962" y="-67" font-family="Arial" font-size="11">3. HTTPS/TLS protects configuration, telemetry and management traffic; mTLS is preferred where supported.</text><text x="962" y="-55" font-family="Arial" font-size="11">4. TR-069 carries management intent and parameters, not unrestricted shell commands.</text><text x="962" y="-43" font-family="Arial" font-size="11">5. DMS/ACS can manage device configuration, grouping, inventory, diagnostics and update campaigns.</text><text x="962" y="-31" font-family="Arial" font-size="11">6. Privileged update execution remains local to dedicated OTA components after policy and signature validation.</text><text x="962" y="-19" font-family="Arial" font-size="11">7. Device identity certificates can be used to authenticate the management channel.</text><text x="962" y="-7" font-family="Arial" font-size="11">8. Management activity should be logged for audit and IEC 62443 traceability.</text></g></svg>