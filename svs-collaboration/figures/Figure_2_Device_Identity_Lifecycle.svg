<g id="node5" class="node"><title>kp</title><polygon fill="#f8fafc" stroke="#64748b" points="1679,-116 1136,-116 1136,0 1685,0 1685,-110 1679,-116"/><text text-anchor="start" x="1144" y="-103.2" font-family="Arial" font-size="11.00">KEY POINTS</text><text text-anchor="start" x="1144" y="-91.2" font-family="Arial" font-size="11.00">1. IDevID is the long-lived manufacturer identity and is TPM-bound/non-exportable.</text><text text-anchor="start" x="1144" y="-79.2" font-family="Arial" font-size="11.00">2. LDevID is obtained after deployment and is the preferred renewable operational identity.</text><text text-anchor="start" x="1144" y="-67.2" font-family="Arial" font-size="11.00">3. LDevID enrollment is authenticated using the existing IDevID trust relationship.</text><text text-anchor="start" x="1144" y="-55.2" font-family="Arial" font-size="11.00">4. Certificate issuance, renewal, revocation and status are centralized in SVS PKI services.</text><text text-anchor="start" x="1144" y="-43.2" font-family="Arial" font-size="11.00">5. Private keys remain protected by TPM 2.0 throughout the lifecycle.</text><text text-anchor="start" x="1144" y="-31.2" font-family="Arial" font-size="11.00">6. Operational services should use renewable credentials rather than the manufacturing identity where practical.</text><text text-anchor="start" x="1144" y="-19.2" font-family="Arial" font-size="11.00">7. All identity lifecycle actions should be auditable and policy-controlled.</text><text text-anchor="start" x="1144" y="-7.2" font-family="Arial" font-size="11.00">8. Decommissioning includes certificate revocation and secure secret removal.</text></g>
</g></svg>