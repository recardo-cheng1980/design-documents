<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1550" height="196" viewBox="0 0 1550 196"><rect width="1550" height="196" fill="white"/><text x="775" y="28" text-anchor="middle" font-family="Arial" font-size="24">Figure 4. OTA Update Flow</text><text x="775" y="54" text-anchor="middle" font-family="Arial" font-size="20">Secure and Validated Container / System Update</text><g font-family="Arial" font-size="11"><rect x="20" y="78" width="180" height="88" rx="12" fill="#ecfdf5" stroke="#16a34a"/><text x="110" y="94" text-anchor="middle">1. Build &amp; Sign</text><text x="35" y="110">CI/CD build</text><text x="35" y="124">SBOM + dependency scan</text><text x="35" y="138">OSTree commit / container image</text><text x="35" y="152">Sign artifact</text><rect x="235" y="84" width="210" height="76" rx="12" fill="#eff6ff" stroke="#2563eb"/><text x="340" y="100" text-anchor="middle">2. Campaign</text><text x="250" y="116">DMS/ACS selects target/version/window</text><text x="250" y="130">Approval policy</text><text x="250" y="144">Send update intent via TR-069</text><rect x="480" y="84" width="250" height="76" rx="12" fill="#f5f3ff" stroke="#8b5cf6"/><text x="605" y="100" text-anchor="middle">3. Download &amp; Verify</text><text x="495" y="116">Local OTA manager / agents</text><text x="495" y="130">Fetch over HTTPS/mTLS</text><text x="495" y="144">Verify signer, digest, model, version, anti-rollback</text><rect x="765" y="72" width="205" height="100" rx="12" fill="#fff7ed" stroke="#ea580c"/><text x="867" y="90" text-anchor="middle">4. Apply &amp; Validate</text><text x="780" y="106">Container pull or OSTree A/B stage</text><text x="780" y="120">Maintenance-window reboot if required</text><text x="780" y="134">Health checks</text><text x="780" y="148">Automatic rollback on failure</text><text x="780" y="162">Report result</text><line x1="200" y1="122" x2="235" y2="122" stroke="#334155"/><line x1="445" y1="122" x2="480" y2="122" stroke="#334155"/><line x1="730" y1="122" x2="765" y2="122" stroke="#334155"/><rect x="995" y="64" width="535" height="112" fill="#f8fafc" stroke="#64748b"/><text x="1010" y="82">KEY POINTS</text><text x="1010" y="96">1. Update artifacts are built, scanned and cryptographically signed before release.</text><text x="1010" y="109">2. DMS/ACS creates controlled campaigns with target, version and maintenance policy.</text><text x="1010" y="122">3. TR-069 delivers update intent; it does not execute arbitrary updater scripts.</text><text x="1010" y="135">4. Gateway downloads over HTTPS/mTLS from approved registry/OSTree remote.</text><text x="1010" y="148">5. Local verification checks signature, digest, model, version and anti-rollback.</text><text x="1010" y="161">6. A/B staging, health checks and automatic rollback protect availability.</text></g></svg>