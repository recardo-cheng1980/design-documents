<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="250" viewBox="0 0 1600 250"><rect width="1600" height="250" fill="white"/><text x="800" y="28" text-anchor="middle" font-family="Arial" font-size="24">Figure 6. Authentication Architecture and Flows</text><text x="800" y="54" text-anchor="middle" font-family="Arial" font-size="20">Separate WPA3-Enterprise Wi-Fi AAA and SSH Authentication</text><g font-family="Arial" font-size="11"><text x="30" y="82" font-size="16">A. Wi-Fi AAA / WPA3-Enterprise</text><rect x="30" y="98" width="130" height="54" rx="12" fill="#ecfdf5" stroke="#16a34a"/><text x="95" y="120" text-anchor="middle">Wi-Fi Client</text><text x="95" y="136" text-anchor="middle">User / Device</text><rect x="260" y="98" width="170" height="54" rx="12" fill="#eff6ff" stroke="#2563eb"/><text x="345" y="120" text-anchor="middle">IQ-9075 Wi-Fi AP</text><text x="345" y="136" text-anchor="middle">802.1X Authenticator</text><rect x="560" y="98" width="170" height="54" rx="12" fill="#f5f3ff" stroke="#8b5cf6"/><text x="645" y="120" text-anchor="middle">SVS RADIUS Server</text><text x="645" y="136" text-anchor="middle">Wi-Fi AAA only</text><line x1="160" y1="125" x2="260" y2="125" stroke="#16a34a"/><text x="210" y="116" text-anchor="middle">WPA3-Enterprise / 802.1X / EAP</text><line x1="430" y1="125" x2="560" y2="125" stroke="#2563eb"/><text x="495" y="108" text-anchor="middle">RADIUS</text><text x="495" y="120" text-anchor="middle">UDP 1812</text><text x="495" y="140" text-anchor="middle">1813 accounting optional</text><text x="30" y="190" font-size="16">B. SSH Authentication</text><rect x="30" y="202" width="130" height="40" rx="12" fill="#ecfdf5" stroke="#16a34a"/><text x="95" y="226" text-anchor="middle">SSH Administrator</text><rect x="260" y="194" width="210" height="56" rx="12" fill="#eff6ff" stroke="#2563eb"/><text x="365" y="214" text-anchor="middle">IQ-9075 sshd</text><text x="365" y="230" text-anchor="middle">OpenSSH → PAM → SSSD</text><rect x="560" y="202" width="170" height="40" rx="12" fill="#f5f3ff" stroke="#8b5cf6"/><text x="645" y="226" text-anchor="middle">SVS LDAP Directory</text><line x1="160" y1="222" x2="260" y2="222" stroke="#a16207"/><text x="210" y="214" text-anchor="middle">SSH port 22</text><line x1="470" y1="222" x2="560" y2="222" stroke="#7c3aed"/><text x="515" y="214" text-anchor="middle">LDAPS TCP 636</text><rect x="780" y="82" width="790" height="160" fill="#f8fafc" stroke="#64748b"/><text x="795" y="100">KEY POINTS</text><text x="795" y="116">1. RADIUS is dedicated to Wi-Fi AAA for WPA3-Enterprise / 802.1X authentication.</text><text x="795" y="132">2. IQ-9075 Wi-Fi AP acts as the 802.1X authenticator and RADIUS client.</text><text x="795" y="148">3. RADIUS uses UDP 1812; accounting on UDP 1813 is optional.</text><text x="795" y="164">4. Wi-Fi AAA does not require LDAP unless explicitly configured as a RADIUS backend.</text><text x="795" y="180">5. SSH login is separate: SSH client → sshd → PAM → SSSD → LDAP over LDAPS TCP 636.</text><text x="795" y="196">6. There is no RADIUS involvement in SSH authentication.</text><text x="795" y="212">7. LDAP stores SSH user identities and group membership for role-based authorization.</text><text x="795" y="228">8. Both flows enforce unique identity, least privilege, logging and strong cryptography.</text></g></svg>