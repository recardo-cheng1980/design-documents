<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1650" height="220" viewBox="0 0 1650 220"><rect width="1650" height="220" fill="white"/><text x="825" y="28" text-anchor="middle" font-family="Arial" font-size="24">Figure 5. Operational Data, Logging and Monitoring</text><text x="825" y="54" text-anchor="middle" font-family="Arial" font-size="20">Secure Runtime Data Flow and Centralized Visibility</text><g font-family="Arial" font-size="11"><rect x="20" y="82" width="180" height="54" rx="12" fill="#ecfdf5" stroke="#16a34a"/><text x="110" y="102" text-anchor="middle">OT / Field Devices</text><text x="110" y="118" text-anchor="middle">Sensors / PLCs / Cameras</text><rect x="250" y="74" width="210" height="70" rx="12" fill="#eff6ff" stroke="#2563eb"/><text x="355" y="95" text-anchor="middle">IQ-9075 Edge Applications</text><text x="355" y="112" text-anchor="middle">Protocol adapters / data processing</text><rect x="510" y="58" width="180" height="48" rx="12" fill="#eff6ff" stroke="#2563eb"/><text x="600" y="78" text-anchor="middle">Logging / Audit</text><text x="600" y="94" text-anchor="middle">journald / rsyslog / Wazuh</text><rect x="510" y="122" width="180" height="48" rx="12" fill="#eff6ff" stroke="#2563eb"/><text x="600" y="142" text-anchor="middle">Monitoring Agent</text><text x="600" y="158" text-anchor="middle">Health / performance metrics</text><rect x="760" y="58" width="180" height="48" rx="12" fill="#f5f3ff" stroke="#8b5cf6"/><text x="850" y="78" text-anchor="middle">SVS SIEM / Log Collector</text><text x="850" y="94" text-anchor="middle">Security events / audit logs</text><rect x="760" y="122" width="180" height="48" rx="12" fill="#f5f3ff" stroke="#8b5cf6"/><text x="850" y="142" text-anchor="middle">SVS Monitoring / Alerting</text><text x="850" y="158" text-anchor="middle">Metrics / dashboards / alerts</text><rect x="1010" y="82" width="160" height="54" rx="12" fill="#f5f3ff" stroke="#8b5cf6"/><text x="1090" y="102" text-anchor="middle">SVS MQTT Broker</text><text x="1090" y="118" text-anchor="middle">mTLS :8883</text><line x1="200" y1="109" x2="250" y2="109" stroke="#16a34a"/><line x1="460" y1="109" x2="1010" y2="109" stroke="#16a34a"/><text x="735" y="102" text-anchor="middle">MQTT over mTLS :8883</text><line x1="460" y1="94" x2="510" y2="82" stroke="#334155"/><line x1="460" y1="124" x2="510" y2="146" stroke="#334155"/><line x1="690" y1="82" x2="760" y2="82" stroke="#ea580c"/><line x1="690" y1="146" x2="760" y2="146" stroke="#0f766e"/><rect x="1195" y="62" width="435" height="118" fill="#f8fafc" stroke="#64748b"/><text x="1210" y="80">KEY POINTS</text><text x="1210" y="94">1. Field data is acquired by gateway applications and forwarded through authenticated MQTT.</text><text x="1210" y="108">2. MQTT operational data uses mTLS on port 8883 for confidentiality and device identity.</text><text x="1210" y="122">3. System, application and security logs are collected locally before secure forwarding.</text><text x="1210" y="136">4. SIEM receives audit/security events for correlation, investigation and retention.</text><text x="1210" y="150">5. Monitoring agents collect device health, service state and performance metrics.</text><text x="1210" y="164">6. Logging and monitoring are continuous runtime flows and support IEC 62443 auditability.</text></g></svg>