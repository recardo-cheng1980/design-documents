<!-- kp -->
<g id="node15" class="node">
<title>kp</title>
<polygon fill="#f8fafc" stroke="#64748b" points="1675,-140 1207,-140 1207,0 1681,0 1681,-134 1675,-140"/>
<polyline fill="none" stroke="#64748b" points="1675,-140 1675,-134 "/>
<polyline fill="none" stroke="#64748b" points="1681,-134 1675,-134 "/>
<text text-anchor="start" x="1215" y="-127.2" font-family="Arial" font-size="11.00">KEY POINTS</text>
<text text-anchor="start" x="1215" y="-115.2" font-family="Arial" font-size="11.00">1. OT, DMZ and IT run in separate LXC namespaces with controlled routing.</text>
<text text-anchor="start" x="1215" y="-103.2" font-family="Arial" font-size="11.00">2. RADIUS is dedicated to WPA3&#45;Enterprise Wi&#45;Fi AAA only.</text>
<text text-anchor="start" x="1215" y="-91.2" font-family="Arial" font-size="11.00">3. SSH authentication uses PAM/SSSD against LDAP over LDAPS; no RADIUS in SSH.</text>
<text text-anchor="start" x="1215" y="-79.2" font-family="Arial" font-size="11.00">4. TPM 2.0 protects device private keys and supports hardware&#45;rooted identity.</text>
<text text-anchor="start" x="1215" y="-67.2" font-family="Arial" font-size="11.00">5. TR&#45;069/CWMP provides fleet management through SVS DMS/ACS.</text>
<text text-anchor="start" x="1215" y="-55.2" font-family="Arial" font-size="11.00">6. MQTT operational traffic uses mTLS on port 8883.</text>
<text text-anchor="start" x="1215" y="-43.2" font-family="Arial" font-size="11.00">7. OTA artifacts are signed, verified and applied by dedicated local OTA components.</text>
<text text-anchor="start" x="1215" y="-31.2" font-family="Arial" font-size="11.00">8. Logs, metrics and security events are forwarded securely to monitoring/SIEM.</text>
<text text-anchor="start" x="1215" y="-19.2" font-family="Arial" font-size="11.00">9. External communications use TLS/mTLS and least&#45;privilege firewall policy.</text>
<text text-anchor="start" x="1215" y="-7.2" font-family="Arial" font-size="11.00">10. Architecture supports IEC 62443 principles: segmentation, traceability and least functionality.</text>
</g>
</g>
</svg>
